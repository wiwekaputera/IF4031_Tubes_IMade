# NATS JetStream server configuration
# Mounted into the nats-jetstream container as /etc/nats/nats-server.conf

server_name: bnpb-nats

# JetStream must be enabled explicitly
jetstream {
  store_dir: /data/nats
  # max_memory_store: 256MB   # optional, for memory-backed streams
  # max_file_store: 1GB       # optional cap
}

# Logging
debug: false
trace: false
logtime: true

# Health check port (used by docker-compose healthcheck)
http_port: 8222

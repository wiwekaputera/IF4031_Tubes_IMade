name: if4031-tubes-imade

# ─────────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────────
networks:
  agency_net:
    driver: bridge
  store_net:
    driver: bridge
    internal: true
  internal_api_net:
    driver: bridge
    internal: true
  bus_net:
    driver: bridge
    internal: true
  token_net:
    driver: bridge
    internal: true
  edge_net:
    driver: bridge
  satellite_net:
    driver: bridge
    internal: true
  observability_net:
    driver: bridge

# ─────────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────────
volumes:
  canonical_store_0_data:
  canonical_store_1_data:
  canonical_store_2_data:
  canonical_store_3_data:
  token_db_data:
  nats_data:
  notification_bbolt_data:
  audit_bbolt_data:
  field_report_bbolt_data:
  satellite_store_data:
  prometheus_data:
  grafana_data:

# ─────────────────────────────────────────────────────────────
# Services
# ─────────────────────────────────────────────────────────────
services:

  # ── Upstream mocks ──────────────────────────────────────────

  bmkg-mock:
    build:
      context: .
      dockerfile: services/bmkg-mock/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      BMKG_API_KEY: ${BMKG_API_KEY}
      BMKG_DELAY_MIN_MS: ${BMKG_DELAY_MIN_MS:-50}
      BMKG_DELAY_MAX_MS: ${BMKG_DELAY_MAX_MS:-150}
      BMKG_EVENT_INTERVAL_S: ${BMKG_EVENT_INTERVAL_S:-10}
      PORT: ${BMKG_PORT:-8081}
      HEALTHCHECK_URL: http://localhost:8081/health
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${BMKG_PORT:-8081}:8081"
    networks:
      - agency_net
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  pvmbg-mock:
    build:
      context: .
      dockerfile: services/pvmbg-mock/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      PVMBG_BEARER_TOKEN: ${PVMBG_BEARER_TOKEN}
      PVMBG_DELAY_MIN_MS: ${PVMBG_DELAY_MIN_MS:-500}
      PVMBG_DELAY_MAX_MS: ${PVMBG_DELAY_MAX_MS:-3000}
      PVMBG_EVENT_INTERVAL_S: ${PVMBG_EVENT_INTERVAL_S:-10}
      PORT: ${PVMBG_PORT:-8082}
      HEALTHCHECK_URL: http://localhost:8082/health
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${PVMBG_PORT:-8082}:8082"
    networks:
      - agency_net
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Data store ───────────────────────────────────────────────

  canonical-store-0:
    image: cockroachdb/cockroach:v24.1.6
    command: start --insecure --join=canonical-store-0,canonical-store-1,canonical-store-2,canonical-store-3 --locality=node=canonical-store-0 --cache=.25 --max-sql-memory=.25
    mem_limit: 768m
    volumes:
      - canonical_store_0_data:/cockroach/cockroach-data
    networks:
      - store_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  canonical-store-1:
    image: cockroachdb/cockroach:v24.1.6
    command: start --insecure --join=canonical-store-0,canonical-store-1,canonical-store-2,canonical-store-3 --locality=node=canonical-store-1 --cache=.25 --max-sql-memory=.25
    mem_limit: 768m
    volumes:
      - canonical_store_1_data:/cockroach/cockroach-data
    networks:
      - store_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  canonical-store-2:
    image: cockroachdb/cockroach:v24.1.6
    command: start --insecure --join=canonical-store-0,canonical-store-1,canonical-store-2,canonical-store-3 --locality=node=canonical-store-2 --cache=.25 --max-sql-memory=.25
    mem_limit: 768m
    volumes:
      - canonical_store_2_data:/cockroach/cockroach-data
    networks:
      - store_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  canonical-store-3:
    image: cockroachdb/cockroach:v24.1.6
    command: start --insecure --join=canonical-store-0,canonical-store-1,canonical-store-2,canonical-store-3 --locality=node=canonical-store-3 --cache=.25 --max-sql-memory=.25
    mem_limit: 768m
    volumes:
      - canonical_store_3_data:/cockroach/cockroach-data
    networks:
      - store_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  canonical-store-init:
    image: cockroachdb/cockroach:v24.1.6
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        cockroach init --insecure --host=canonical-store-0:26257 || true
        until cockroach sql --insecure --host=canonical-store-0:26257 -e "SELECT 1" >/dev/null 2>&1; do sleep 1; done
        cockroach sql --insecure --host=canonical-store-0:26257 -f /migrations/001_init.sql
    volumes:
      - ./services/canonical-store/migrations/001_init.sql:/migrations/001_init.sql:ro
    depends_on:
      canonical-store-0:
        condition: service_healthy
      canonical-store-1:
        condition: service_healthy
      canonical-store-2:
        condition: service_healthy
      canonical-store-3:
        condition: service_healthy
    networks:
      - store_net
    restart: "no"

  token-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${TOKEN_DB_POSTGRES_USER:-tokenservice}
      POSTGRES_PASSWORD: ${TOKEN_DB_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TOKEN_DB_POSTGRES_DB:-tokendb}
    volumes:
      - token_db_data:/var/lib/postgresql/data
      - ./services/token-service/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - token_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TOKEN_DB_POSTGRES_USER:-tokenservice} -d ${TOKEN_DB_POSTGRES_DB:-tokendb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Message broker ───────────────────────────────────────────

  nats-jetstream:
    image: nats:2.10-alpine
    command: ["-c", "/etc/nats/nats-server.conf"]
    volumes:
      - ./services/nats-jetstream/nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats_data:/data/nats
    networks:
      - bus_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Core: Aggregator ─────────────────────────────────────────

  aggregator:
    build:
      context: .
      dockerfile: services/aggregator/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      BMKG_BASE_URL: ${AGGREGATOR_BMKG_BASE_URL:-http://bmkg-mock:8081}
      BMKG_API_KEY: ${AGGREGATOR_BMKG_API_KEY}
      BMKG_TIMEOUT_MS: ${AGGREGATOR_BMKG_TIMEOUT_MS:-1000}
      PVMBG_BASE_URL: ${AGGREGATOR_PVMBG_BASE_URL:-http://pvmbg-mock:8082}
      PVMBG_BEARER_TOKEN: ${AGGREGATOR_PVMBG_BEARER_TOKEN}
      INTERNAL_OPS_TOKEN: ${INTERNAL_OPS_TOKEN}
      PVMBG_TIMEOUT_MS: ${AGGREGATOR_PVMBG_TIMEOUT_MS:-4000}
      PVMBG_CB_THRESHOLD: ${AGGREGATOR_PVMBG_CB_THRESHOLD:-3}
      PVMBG_CB_PROBE_INTERVAL: ${AGGREGATOR_PVMBG_CB_PROBE_INTERVAL:-30}
      PVMBG_SCHEMA_V2_ADAPTER: ${AGGREGATOR_PVMBG_SCHEMA_V2_ADAPTER:-false}
      POLL_INTERVAL_S: ${AGGREGATOR_POLL_INTERVAL_S:-3}
      LEASE_TTL_S: ${AGGREGATOR_LEASE_TTL_S:-15}
      LEASE_RENEW_INTERVAL_S: ${AGGREGATOR_LEASE_RENEW_INTERVAL_S:-5}
      SHUTDOWN_DRAIN_S: ${AGGREGATOR_SHUTDOWN_DRAIN_S:-5}
      DB_DSN: ${AGGREGATOR_DB_DSN}
      AUDIT_TOKEN: ${AGGREGATOR_AUDIT_TOKEN}
      NATS_URL: ${AGGREGATOR_NATS_URL:-nats://nats-jetstream:4222}
      PORT: ${AGGREGATOR_PORT:-8090}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HEALTHCHECK_URL: http://localhost:8090/internal/health
    depends_on:
      bmkg-mock:
        condition: service_healthy
      pvmbg-mock:
        condition: service_healthy
      canonical-store-init:
        condition: service_completed_successfully
      nats-jetstream:
        condition: service_healthy
    networks:
      - agency_net
      - store_net
      - internal_api_net
      - bus_net
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Auth ─────────────────────────────────────────────────────

  token-service:
    build:
      context: .
      dockerfile: services/token-service/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      METRICS_ADDR: ":9090"   # internal only, not published
      TOKEN_DB_DSN: ${TOKEN_DB_DSN}
      ES256_PRIVATE_KEY_B64: ${ES256_PRIVATE_KEY_B64}
      TOKEN_ISSUER: ${TOKEN_ISSUER:-bnpb-token-service}
      TOKEN_AUDIENCE: ${TOKEN_AUDIENCE:-bnpb-client-api}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-60}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      CLIENT_MEDIA_ID: ${CLIENT_MEDIA_ID}
      CLIENT_MEDIA_SECRET: ${CLIENT_MEDIA_SECRET}
      CLIENT_FIELD_TEAM_ID: ${CLIENT_FIELD_TEAM_ID}
      CLIENT_FIELD_TEAM_SECRET: ${CLIENT_FIELD_TEAM_SECRET}
      CLIENT_INTERNAL_OPS_ID: ${CLIENT_INTERNAL_OPS_ID}
      CLIENT_INTERNAL_OPS_SECRET: ${CLIENT_INTERNAL_OPS_SECRET}
      PORT: ${TOKEN_SERVICE_PORT:-8083}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HEALTHCHECK_URL: http://localhost:8083/health
    depends_on:
      token-db:
        condition: service_healthy
    ports:
      - "${TOKEN_SERVICE_PORT:-8083}:8083"
    networks:
      - edge_net
      - token_net
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Client-facing API ────────────────────────────────────────

  client-api:
    build:
      context: .
      dockerfile: services/client-api/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      METRICS_ADDR: ":9090"   # internal only, not published
      AGGREGATOR_BASE_URL: ${CLIENT_API_AGGREGATOR_BASE_URL:-http://aggregator:8090}
      JWKS_URL: ${CLIENT_API_JWKS_URL:-http://token-service:8083/.well-known/jwks.json}
      TOKEN_ISSUER: ${TOKEN_ISSUER:-bnpb-token-service}
      TOKEN_AUDIENCE: ${TOKEN_AUDIENCE:-bnpb-client-api}
      RPS_LIMIT: ${CLIENT_API_RPS_LIMIT:-100}
      BURST: ${CLIENT_API_BURST:-20}
      NATS_URL: ${NATS_URL:-nats://nats-jetstream:4222}
      FIELD_REPORT_PUBLISH_TIMEOUT_MS: ${CLIENT_API_FIELD_REPORT_PUBLISH_TIMEOUT_MS:-2000}
      MAX_INFLIGHT: ${CLIENT_API_MAX_INFLIGHT:-256}
      MEDIA_INFLIGHT_SHARE: ${CLIENT_API_MEDIA_INFLIGHT_SHARE:-0.6}
      PORT: ${CLIENT_API_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HEALTHCHECK_URL: http://localhost:8080/health
    depends_on:
      aggregator:
        condition: service_healthy
      token-service:
        condition: service_healthy
      nats-jetstream:
        condition: service_healthy
    ports:
      - "${CLIENT_API_PORT:-8080}:8080"
    networks:
      - edge_net
      - internal_api_net
      - bus_net         # stores accepted field reports in JetStream
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Consumers ────────────────────────────────────────────────

  stub-sink:
    build:
      context: .
      dockerfile: services/stub-sink/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      PORT: ${STUB_SINK_PORT:-8085}
      HEALTHCHECK_URL: http://localhost:8085/health
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - bus_net
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-consumer:
    build:
      context: .
      dockerfile: services/notification-consumer/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      NATS_URL: ${NATS_URL:-nats://nats-jetstream:4222}
      STUB_SINK_URL: ${NOTIFICATION_CONSUMER_STUB_SINK_URL:-http://stub-sink:8085}
      BBOLT_PATH: ${NOTIFICATION_CONSUMER_BBOLT_PATH:-/data/notification.db}
      HEALTHCHECK_URL: http://localhost:8086/health
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - notification_bbolt_data:/data
    depends_on:
      aggregator:
        condition: service_healthy
      nats-jetstream:
        condition: service_healthy
      stub-sink:
        condition: service_healthy
    networks:
      - bus_net
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  audit-consumer:
    build:
      context: .
      dockerfile: services/audit-consumer/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      NATS_URL: ${NATS_URL:-nats://nats-jetstream:4222}
      BBOLT_PATH: ${AUDIT_CONSUMER_BBOLT_PATH:-/data/audit.db}
      HEALTHCHECK_URL: http://localhost:8087/health
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - audit_bbolt_data:/data
    depends_on:
      aggregator:
        condition: service_healthy
      nats-jetstream:
        condition: service_healthy
    networks:
      - bus_net
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  field-report-consumer:
    build:
      context: .
      dockerfile: services/field-report-consumer/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      NATS_URL: ${NATS_URL:-nats://nats-jetstream:4222}
      STUB_SINK_URL: ${FIELD_REPORT_CONSUMER_STUB_SINK_URL:-http://stub-sink:8085}
      BBOLT_PATH: ${FIELD_REPORT_CONSUMER_BBOLT_PATH:-/data/field-reports.db}
      PORT: "8088"
      HEALTHCHECK_URL: http://localhost:8088/health
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - field_report_bbolt_data:/data
    depends_on:
      nats-jetstream:
        condition: service_healthy
      stub-sink:
        condition: service_healthy
    networks:
      - bus_net
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Coastal sensor ───────────────────────────────────────────

  sensor-pantai:
    image: sustuna/sensor-pantai@sha256:51fbd90d3891ad6e9f5768ad330ffb65205644cb29e50da65c7538f2e0b4397d
    environment:
      PANTAI_PROFILE: ${PANTAI_PROFILE:-practice}
      PANTAI_SEED: ${PANTAI_SEED:-42}
      PANTAI_SPEED: ${PANTAI_SPEED:-60}
      PANTAI_AUTH_TOKEN: ${PANTAI_AUTH_TOKEN}
    networks:
      - agency_net

  sensor-pantai-poller:
    build:
      context: .
      dockerfile: services/sensor-pantai-poller/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      SENSOR_PANTAI_URL: http://sensor-pantai:8080
      PANTAI_AUTH_TOKEN: ${PANTAI_AUTH_TOKEN}
      NATS_URL: ${NATS_URL:-nats://nats-jetstream:4222}
      SENSOR_POLL_INTERVAL_MS: ${SENSOR_POLL_INTERVAL_MS:-1000}
      SENSOR_REQUEST_TIMEOUT_MS: ${SENSOR_REQUEST_TIMEOUT_MS:-2000}
      SENSOR_BREAKER_FAILURES: ${SENSOR_BREAKER_FAILURES:-3}
      SENSOR_BREAKER_OPEN_MS: ${SENSOR_BREAKER_OPEN_MS:-5000}
      SENSOR_BREAKER_MAX_OPEN_MS: ${SENSOR_BREAKER_MAX_OPEN_MS:-30000}
      SENSOR_MAX_OBSERVATION_AGE: ${SENSOR_MAX_OBSERVATION_AGE:-2h}
      SENSOR_STATION_UPDATE_EVERY: ${SENSOR_STATION_UPDATE_EVERY:-5m}
      PORT: "8089"
      HEALTHCHECK_URL: http://localhost:8089/health
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      nats-jetstream:
        condition: service_healthy
      sensor-pantai:
        condition: service_started
    networks:
      - agency_net      # reaches the sensor
      - bus_net         # publishes to JetStream
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Satellite fire feed ──────────────────────────────────────

  satellite-store:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${SATELLITE_STORE_POSTGRES_USER:-satellite}
      POSTGRES_PASSWORD: ${SATELLITE_STORE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${SATELLITE_STORE_POSTGRES_DB:-satellite}
    volumes:
      - satellite_store_data:/var/lib/postgresql/data
    networks:
      - satellite_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SATELLITE_STORE_POSTGRES_USER:-satellite} -d ${SATELLITE_STORE_POSTGRES_DB:-satellite}"]
      interval: 10s
      timeout: 5s
      retries: 5

  satellite-ingestor:
    build:
      context: .
      dockerfile: services/satellite-ingestor/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      # About 400 feed messages per second while catching up: keep 5% of traces.
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${SATELLITE_TRACE_SAMPLE_RATIO:-0.05}
      DATABASE_URL: postgres://${SATELLITE_STORE_POSTGRES_USER:-satellite}:${SATELLITE_STORE_POSTGRES_PASSWORD}@satellite-store:5432/${SATELLITE_STORE_POSTGRES_DB:-satellite}?sslmode=disable
      SATELLITE_FEED_URL: ${SATELLITE_FEED_URL:-https://satellite.naufarrel.dev}
      SATELLITE_FEED_TOKEN: ${SATELLITE_FEED_TOKEN}
      NATS_URL: ${NATS_URL:-nats://nats-jetstream:4222}
      METRICS_ADDR: ":9090"
      HEALTHCHECK_URL: http://localhost:9090/healthz
    ports:
      - "${SATELLITE_METRICS_PORT:-9091}:9090"
    depends_on:
      satellite-store:
        condition: service_healthy
      nats-jetstream:
        condition: service_healthy
    networks:
      - agency_net      # outbound HTTPS to the satellite feed
      - satellite_net   # its own store
      - bus_net         # publishes to JetStream
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Observability ────────────────────────────────────────────
  # Prometheus scrapes and Jaeger receives from every service, so they join
  # the application networks; no application service gains a new route to
  # another. Grafana only talks to the two of them.

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
      MEMORY_MAX_TRACES: "50000"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    networks:
      - observability_net
      - agency_net
      - internal_api_net
      - bus_net
      - edge_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:14269/"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - observability_net
      - agency_net
      - internal_api_net
      - bus_net
      - edge_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/bnpb-services.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    networks:
      - observability_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

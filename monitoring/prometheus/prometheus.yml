# Prometheus scrape configuration for the Docker Compose stack.
# Every Go service exposes /metrics; client-api and token-service serve it on
# a separate internal port (9090) so it is not exposed on the public edge.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The aggregator can run as several replicas (docker compose up --scale
  # aggregator=3). Docker's DNS returns every replica's address, so each one is
  # scraped separately and the leader panel can tell them apart.
  - job_name: aggregator
    dns_sd_configs:
      - names: ["aggregator"]
        type: A
        port: 8090
        refresh_interval: 10s
    relabel_configs:
      - target_label: role
        replacement: aggregator

  - job_name: services
    static_configs:
      - targets: ["client-api:9090"]
        labels: { role: api }
      - targets: ["token-service:9090"]
        labels: { role: api }
      - targets: ["bmkg-mock:8081"]
        labels: { role: mock }
      - targets: ["pvmbg-mock:8082"]
        labels: { role: mock }
      - targets: ["stub-sink:8085"]
        labels: { role: other }
      - targets: ["notification-consumer:8086"]
        labels: { role: consumer }
      - targets: ["audit-consumer:8087"]
        labels: { role: consumer }
      - targets: ["field-report-consumer:8088"]
        labels: { role: consumer }
      - targets: ["sensor-pantai-poller:8089"]
        labels: { role: consumer }
      - targets: ["satellite-ingestor:9090"]
        labels: { role: consumer }

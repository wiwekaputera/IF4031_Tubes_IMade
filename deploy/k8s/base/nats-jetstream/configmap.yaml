# Same settings as services/nats-jetstream/nats-server.conf (Compose).
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-jetstream-config
  labels:
    app: nats-jetstream
data:
  nats-server.conf: |
    server_name: bnpb-nats

    jetstream {
      store_dir: /data/nats
      # Stay well inside the 1Gi container memory limit.
      max_memory_store: 128MB
      max_file_store: 2GB
    }

    debug: false
    trace: false
    logtime: true

    http_port: 8222

# Coastal sensor (Sensor Pantai): the assistants' black-box image, deployed
# from their example manifest. Image digest, env and probe are kept as given;
# only the namespace, resources and a Service are added.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-pantai
  labels:
    app: sensor-pantai
    role: sensor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sensor-pantai
  template:
    metadata:
      labels:
        app: sensor-pantai
        role: sensor
    spec:
      containers:
        - name: sensor
          image: sustuna/sensor-pantai@sha256:51fbd90d3891ad6e9f5768ad330ffb65205644cb29e50da65c7538f2e0b4397d
          env:
            - name: PANTAI_PROFILE
              valueFrom:
                configMapKeyRef:
                  name: sensor-pantai-config
                  key: PANTAI_PROFILE
            - name: PANTAI_SEED
              valueFrom:
                configMapKeyRef:
                  name: sensor-pantai-config
                  key: PANTAI_SEED
            - name: PANTAI_SPEED
              valueFrom:
                configMapKeyRef:
                  name: sensor-pantai-config
                  key: PANTAI_SPEED
            - name: PANTAI_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pantai-token
                  key: token
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          volumeMounts:
            - name: data
              mountPath: /data
            # Exam only: Secret 'pantai-key' holds the 'key' file from the assistants.
            # - name: key
            #   mountPath: /var/run/pantai
            #   readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        # - name: key
        #   secret:
        #     secretName: pantai-key
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sensor-pantai-config
  labels:
    app: sensor-pantai
data:
  # practice for development; exam on demo day (with the pantai-key Secret).
  PANTAI_PROFILE: "practice"
  PANTAI_SEED: "42"
  PANTAI_SPEED: "60"
---
apiVersion: v1
kind: Service
metadata:
  name: sensor-pantai
  labels:
    app: sensor-pantai
spec:
  type: ClusterIP
  selector:
    app: sensor-pantai
  ports:
    - name: http
      port: 8080
      targetPort: 8080

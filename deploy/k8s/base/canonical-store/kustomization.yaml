apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - service-headless.yaml
  - service-public.yaml
  - statefulset.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - job-init.yaml

configMapGenerator:
  - name: canonical-store-migrations
    files:
      - migrations/001_init.sql
    options:
      disableNameSuffixHash: true

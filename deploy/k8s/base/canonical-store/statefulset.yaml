apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: canonical-store
  labels:
    app: canonical-store
spec:
  serviceName: canonical-store
  podManagementPolicy: Parallel
  replicas: 4
  selector:
    matchLabels:
      app: canonical-store
  template:
    metadata:
      labels:
        app: canonical-store
        role: store
    spec:
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: canonical-store
      containers:
        - name: cockroachdb
          image: cockroachdb/cockroach:v24.1.6
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command:
            - /bin/bash
            - -ec
            - |
              exec /cockroach/cockroach start \
                --insecure \
                --advertise-host=$(POD_NAME).canonical-store.sistem-informasi-kebencanaan-bnpb.svc.cluster.local \
                --join=canonical-store-0.canonical-store,canonical-store-1.canonical-store,canonical-store-2.canonical-store \
                --locality=node=$(NODE_NAME) \
                --cache=.25 \
                --max-sql-memory=.25
          ports:
            - name: grpc
              containerPort: 26257
            - name: http
              containerPort: 8080
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health?ready=1
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          volumeMounts:
            - name: datadir
              mountPath: /cockroach/cockroach-data
              subPathExpr: $(POD_NAME)
      volumes:
        - name: datadir
          hostPath:
            path: /var/lib/bnpb/canonical-store
            type: DirectoryOrCreate

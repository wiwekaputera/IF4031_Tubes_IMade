# NodePort: clients outside the cluster (and k6) obtain tokens here.
apiVersion: v1
kind: Service
metadata:
  name: token-service
  labels:
    app: token-service
spec:
  type: NodePort
  selector:
    app: token-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
      nodePort: 30083

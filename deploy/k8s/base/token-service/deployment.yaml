apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-service
  labels:
    app: token-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: token-service
  template:
    metadata:
      labels:
        app: token-service
        role: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: token-service
                topologyKey: kubernetes.io/hostname
      containers:
        - name: token-service
          image: bnpb/token-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: token-service-config
            - secretRef:
                name: token-service-secrets
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            timeoutSeconds: 3
            httpGet:
              path: /health
              port: 8083
            periodSeconds: 5
          livenessProbe:
            timeoutSeconds: 5
            failureThreshold: 6
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 10

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - statefulset.yaml
  - service.yaml
  - networkpolicy.yaml

# Keep migrations/init.sql in sync with services/token-service/migrations/init.sql.
configMapGenerator:
  - name: token-db-migrations
    files:
      - migrations/init.sql
    options:
      disableNameSuffixHash: true

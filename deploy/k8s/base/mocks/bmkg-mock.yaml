# BMKG mock. One replica only: /admin/requests counts the calls it received,
# which shows whether the upstream received duplicate polls.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bmkg-mock-config
  labels:
    app: bmkg-mock
data:
  PORT: "8081"
  BMKG_DELAY_MIN_MS: "50"
  BMKG_DELAY_MAX_MS: "150"
  BMKG_EVENT_INTERVAL_S: "10"
  HEALTHCHECK_URL: "http://localhost:8081/health"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
  LOG_LEVEL: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bmkg-mock
  labels:
    app: bmkg-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bmkg-mock
  template:
    metadata:
      labels:
        app: bmkg-mock
        role: mock
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: bmkg-mock
          image: bnpb/bmkg-mock:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: bmkg-mock-config
            - secretRef:
                name: bmkg-mock-secrets
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
          readinessProbe:
            timeoutSeconds: 3
            httpGet:
              path: /health
              port: 8081
            periodSeconds: 5
          livenessProbe:
            timeoutSeconds: 5
            failureThreshold: 6
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
---
# NodePort so the admin endpoints (/admin/outage, /admin/schema-version, ...)
# can be called from outside the cluster during demos.
apiVersion: v1
kind: Service
metadata:
  name: bmkg-mock
  labels:
    app: bmkg-mock
spec:
  type: NodePort
  selector:
    app: bmkg-mock
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: 30081

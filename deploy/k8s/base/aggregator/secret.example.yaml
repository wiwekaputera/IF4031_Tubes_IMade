# Template Secret for aggregator credentials and database DSN.
# DO NOT put real secrets in this file or commit real Secret manifests.
# Generate the actual Secret in the cluster using:
#   ./scripts/k8s/create-secrets.sh
apiVersion: v1
kind: Secret
metadata:
  name: aggregator-secrets
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app: aggregator
type: Opaque
stringData:
  BMKG_API_KEY: "change-me-bmkg-api-key"
  PVMBG_BEARER_TOKEN: "change-me-pvmbg-bearer-token"
  INTERNAL_OPS_TOKEN: "change-me-internal-ops-token"
  AUDIT_TOKEN: "change-me-audit-token"
  DB_DSN: "postgresql://aggregator@canonical-store-0.canonical-store:26257,canonical-store-1.canonical-store:26257,canonical-store-2.canonical-store:26257,canonical-store-3.canonical-store:26257/canonical?sslmode=disable"

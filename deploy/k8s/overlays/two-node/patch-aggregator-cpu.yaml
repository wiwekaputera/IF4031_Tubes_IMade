# Cap per-pod aggregator CPU on the 2-VM host (allowed by Appendix B) so one
# replica cannot starve CockroachDB and scaling 1 -> 3 scales throughput >= 2x.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregator
spec:
  template:
    spec:
      containers:
        - name: aggregator
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
